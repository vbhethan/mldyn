[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mldyn"
version = "0.1.0"
description = "Transformer-based molecular dynamics modeling utilities."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vignesh C. Bhethanabotla", email = "vbhethan@caltech.edu" }]
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "MDAnalysis>=2.6",
    "h5py>=3.10",
    "scipy>=1.11",
    "tqdm>=4.66",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "black>=23.12",
    "ruff>=0.3",
]
cuda = [
    # Install with the PyTorch CUDA wheels index:
    # pip install --extra-index-url https://download.pytorch.org/whl/cu121 "mldyn[cuda]"
    "torch==2.2.2+cu121",
]
cpu = [
    "torch>=2.2",
]

[tool.setuptools.packages.find]
include = ["mldyn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

# Pixi environment. `pixi install` builds .pixi/ and installs mldyn editable.
# Add "linux-64" to platforms when setting this up on a cluster.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
mldyn = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.11.*"
pytorch = ">=2.2"
numpy = ">=1.24"
mdanalysis = ">=2.6"
h5py = ">=3.10"
scipy = ">=1.11"
tqdm = ">=4.66"
matplotlib-base = ">=3.7"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.4"
black = ">=23.12"
ruff = ">=0.3"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
train = "python train.py"
post-process = "python post-process.py"

[tool.pixi.feature.dev.tasks]
test = "pytest"
fmt = "black ."
lint = "ruff check ."